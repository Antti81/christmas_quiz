<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: a dark spruce stage; cream "record sleeve" cards hang from a string of lights, and that string is the timeline. */
  --night:#0e1c19; --pine:#16352d; --pine-2:#1e463b; --line:#2e5f51;
  --cream:#f7eedb; --ink:#18261f; --berry:#d9434d; --gold:#f3b94d; --ice:#9cd9d1;
  --good:#52d08f; --bad:#ff7272; --muted:#a3bab2;
  --display:'Alfa Slab One','Rockwell','Georgia',serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--cream);font-family:var(--body);-webkit-font-smoothing:antialiased;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--ice);outline-offset:2px}
[hidden]{display:none !important}
h1,h2,h3{text-wrap:balance}

/* ---------- page frame ---------- */
#app{height:100%;display:flex;flex-direction:column}
#stage{flex:1 1 auto;min-height:0;overflow:auto;position:relative}
#dock{display:none}
.demo-tabs{display:none;background:#0b1714;border-bottom:1px solid var(--line)}
.demo-tabs button{flex:1;border:0;background:transparent;padding:11px 8px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent}
.demo-tabs button.on{color:var(--gold);border-bottom-color:var(--gold)}
body.demo #app{flex-direction:row}
body.demo #stage{--stage-w:calc(100vw - 372px)}
body.demo #dock{display:flex;flex-direction:column;flex:0 0 372px;height:100%;border-left:1px solid var(--line);background:#0b1714;padding:12px 14px 14px}
.dock-cap{font-size:12.5px;color:var(--muted);text-align:center;margin:0 0 8px}
.dock-frame{flex:1;min-height:0;border:2px solid var(--line);border-radius:26px;overflow:auto;background:var(--night);position:relative}
@media (max-width:1099px){
  body.demo #app{flex-direction:column}
  body.demo .demo-tabs{display:flex}
  body.demo #stage{--stage-w:100vw}
  body.demo #dock{flex:1 1 auto;border-left:0;min-height:0}
  body.demo[data-tab="screen"] #dock{display:none}
  body.demo[data-tab="phone"] #stage{display:none}
}

/* ---------- shared bits ---------- */
.btn{border:0;border-radius:999px;padding:.6em 1.3em;font-weight:700;cursor:pointer;font-size:1em;transition:transform .08s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--gold);color:var(--ink)}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--cream);box-shadow:inset 0 0 0 2px var(--line)}
.btn.ghost:hover:not(:disabled){background:var(--pine-2)}
.btn.small{font-size:.85em;padding:.45em .95em}
.btn.big{font-size:1.15em;padding:.75em 1.7em}
.btn.danger{color:var(--bad)}
.btn.armed,.team-chip.armed{background:var(--berry) !important;color:#fff !important;box-shadow:none}
.banner{border-radius:.6em;padding:.65em .95em;font-size:.95em;line-height:1.4}
.banner.bad{background:#4a1d22;border:1px solid var(--bad);color:#ffd9d9}
.banner.warn{background:#3d3214;border:1px solid var(--gold);color:#ffe9bd}
.banner.info{background:var(--pine);border:1px solid var(--ice);display:flex;gap:.7em;align-items:center;flex-wrap:wrap}
.badge{display:inline-block;background:var(--berry);color:#fff;font-weight:800;text-transform:uppercase;letter-spacing:.12em;font-size:.85em;padding:.3em .8em;border-radius:.4em}
.k{color:var(--muted)}
.snow{position:absolute !important;inset:0;width:100%;height:100%;pointer-events:none;z-index:0 !important}
.st-list,.p-toplist{list-style:none;margin:0;padding:0}
.st-row,.p-toplist li{display:flex;align-items:center;gap:.6em;padding:.32em 0;border-bottom:1px solid rgba(46,95,81,.6)}
.st-rank{flex:0 0 1.8em;font-family:var(--display);color:var(--muted);text-align:right}
.st-name{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.st-score{flex:0 0 2.4em;text-align:right;font-family:var(--display);font-variant-numeric:tabular-nums}

/* ---------- the timeline: cards on a string of lights ---------- */
.garland-scroll{overflow-x:auto;padding:.5em 0 .7em}
.garland{font-size:calc(1em * var(--gs,1));--bw:2.5em;display:grid;
  grid-template-columns:repeat(var(--n),var(--bw) minmax(0,1fr)) var(--bw);
  grid-template-rows:minmax(5.2em,auto) 2.4em minmax(5.2em,auto);row-gap:1em;
  max-width:calc(var(--n) * 15em + 6em);min-width:calc(var(--n) * 6.4em + 4em);margin:0 auto;position:relative}
.wire{grid-row:2;height:3px;align-self:center;border-radius:2px;background:linear-gradient(90deg,transparent,var(--line) 5%,var(--line) 95%,transparent)}
.bulb{grid-row:2;justify-self:center;align-self:center;z-index:1;border-radius:50%;display:grid;place-items:center}
.bulb.deco{width:.85em;height:.85em;background:currentColor;box-shadow:0 0 .8em currentColor}
.bulb.lit{width:2em;height:2em;background:var(--gold);color:var(--ink);font-family:var(--display);font-size:1.1em;animation:glow 2.4s ease-in-out infinite;box-shadow:0 0 0 .22em rgba(243,185,77,.2),0 0 1.2em rgba(243,185,77,.5)}
.c-berry{color:var(--berry)} .c-gold{color:var(--gold)} .c-ice{color:var(--ice)} .c-good{color:var(--good)}
.tie{grid-row:2;justify-self:center;width:.4em;height:3px}
.pin{grid-row:2;justify-self:center;align-self:center;width:.62em;height:.62em;border-radius:50%;background:var(--cream);z-index:1}
.tcard{background:var(--cream);color:var(--ink);border-radius:.5em;padding:.5em .55em .55em;text-align:center;position:relative;
  box-shadow:0 .35em .9em rgba(0,0,0,.35);justify-self:center;width:100%;max-width:12.5em;min-width:0}
.tcard.up{align-self:end;transform:rotate(-1.1deg)}
.tcard.down{align-self:start;transform:rotate(1.1deg)}
.tcard::after{content:"";position:absolute;left:50%;width:2px;height:2.2em;margin-left:-1px;background:var(--muted);z-index:-1}
.tcard.up::after{top:100%} .tcard.down::after{bottom:100%}
.tcard.start{background:var(--gold)}
.tcard.new{outline:.24em solid var(--gold);animation:drop .8s cubic-bezier(.2,1.4,.4,1) both}
.ty{font-family:var(--display);font-size:1.75em;line-height:1}
.tl{font-size:.74em;font-weight:600;line-height:1.2;margin-top:.3em;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- big screen: game ---------- */
.host.stage{font-size:clamp(11px,min(calc(var(--stage-w,100vw) * .0125),2.1vh),26px);min-height:100%;display:flex;flex-direction:column;
  padding:1.1em 2em 1em;gap:.8em;position:relative;
  background:radial-gradient(120% 80% at 50% 0%,#1c4136 0%,rgba(28,65,54,0) 62%),var(--night)}
.host.stage > *{position:relative;z-index:1}
.st-head{display:flex;align-items:center;gap:1em;justify-content:space-between}
.st-title{font-family:var(--display);font-size:1.5em;color:var(--gold);flex:1 1 0;min-width:0;overflow-wrap:anywhere}
.st-mid{font-weight:800;font-size:1.1em;letter-spacing:.1em;text-transform:uppercase;color:var(--ice);flex:0 0 auto}
.st-join{flex:1 1 0;display:flex;justify-content:flex-end;align-items:center;gap:.8em;font-size:.9em;color:var(--muted);min-width:0}
.st-joinline{min-width:0;overflow-wrap:anywhere;text-align:right}
.st-join b{color:var(--cream)}
.st-join .jcode{font-family:var(--display);font-weight:400;letter-spacing:.08em;color:var(--gold)}
.icon-btn{border:0;background:var(--pine-2);color:var(--cream);width:2.2em;height:2.2em;border-radius:.5em;cursor:pointer;font-size:1.1em;flex:0 0 auto}
.st-main{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;min-height:0}
.st-timeline{flex:0 0 auto}
.tl-cap{text-align:center;color:var(--muted);font-size:.85em;text-transform:uppercase;letter-spacing:.14em}
.st-ctl{display:flex;justify-content:flex-end;align-items:center;gap:.7em;flex-wrap:wrap}
.ctl-left{display:flex;gap:.7em;align-items:center;flex-wrap:wrap;margin-right:auto}
.saving{color:var(--gold);font-size:.9em}

.lobby{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:2em;align-items:stretch}
.join-card{background:var(--pine);border:2px solid var(--line);border-radius:1.2em;padding:1.4em;display:flex;gap:1.6em;align-items:center}
.qr{flex:0 0 auto;width:15em;max-width:44%;background:var(--cream);padding:.5em;border-radius:.8em}
.qr svg{display:block;width:100%;height:auto}
.qr-missing{aspect-ratio:1;display:grid;place-items:center;color:var(--ink);font-family:var(--display);font-size:2em}
.join-text{min-width:0}
.join-text h2{font-family:var(--display);font-weight:400;font-size:2.5em;line-height:1.05;margin:0 0 .25em}
.join-text p{margin:0}
.jt-scan{font-size:1.2em}
.jt-or{color:var(--muted);margin-top:.8em !important}
.jt-url{font-size:1.25em;font-weight:700;overflow-wrap:anywhere;color:var(--ice)}
.jt-code{margin-top:.6em !important;font-size:1.1em;color:var(--muted)}
.jt-code b{font-family:var(--display);font-weight:400;font-size:1.9em;color:var(--gold);letter-spacing:.12em;margin-left:.15em}
.jt-one{margin-top:.8em !important;font-weight:700}
.teams-card{background:rgba(22,53,45,.6);border:2px dashed var(--line);border-radius:1.2em;padding:1.2em 1.4em;display:flex;flex-direction:column;min-height:13em}
.tc-count{margin:0 0 .6em;font-size:1.4em;font-family:var(--display);font-weight:400}
.tc-list{display:flex;flex-wrap:wrap;gap:.5em;align-content:flex-start;flex:1;overflow:auto;max-height:15em}
.team-chip{border:0;background:var(--cream);color:var(--ink);font-weight:700;border-radius:999px;padding:.35em .9em;cursor:pointer;font-size:1em}
.team-chip.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
.tc-hint{color:var(--muted);font-size:.75em;margin:.6em 0 0}

.q-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:2em;align-items:center}
.q-kindrow{display:flex;align-items:center;gap:1em;margin-bottom:.8em}
.q-text{font-family:var(--display);font-size:3em;line-height:1.08;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.q-text.lg{font-size:2.3em} .q-text.xl{font-size:1.7em}
.q-sub{font-size:1.5em;color:var(--ice);margin:.5em 0 0;font-weight:600}
.vinyl{width:5.5em;height:5.5em;border-radius:50%;position:relative;animation:spin 2.6s linear infinite;box-shadow:0 .3em 1em rgba(0,0,0,.5);
  background:radial-gradient(circle,var(--cream) 0 3%,var(--berry) 4% 17%,#0c0c0c 18% 20%,transparent 21%),repeating-radial-gradient(circle,#151515 0 2px,#232323 2px 4px)}
.vinyl::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,rgba(255,255,255,.2),transparent 12%,transparent 50%,rgba(255,255,255,.14) 56%,transparent 66%)}
.vinyl.stop{animation-play-state:paused}
.qmark{width:2.9em;height:2.9em;border-radius:.5em;background:var(--cream);color:var(--ink);font-family:var(--display);font-size:1.9em;display:grid;place-items:center;transform:rotate(-4deg);box-shadow:0 .2em .7em rgba(0,0,0,.4)}
.q-side{display:flex;flex-direction:column;gap:1.2em;min-width:0}
.timer-row{display:flex;align-items:center;gap:1.2em}
.ring{position:relative;width:7.5em;height:7.5em;flex:0 0 auto}
.ring.off{display:none}
.ring-svg{width:100%;height:100%;display:block}
.ring-bg{fill:none;stroke:var(--pine-2);stroke-width:8}
.ring-arc{fill:none;stroke:var(--gold);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .2s linear}
.ring.low .ring-arc{stroke:var(--berry)}
.ring-num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:2.6em;font-variant-numeric:tabular-nums}
.ring.done .ring-num{color:var(--berry)}
.timer-txt{font-size:1.25em;font-weight:600;min-width:0}
.tu{font-family:var(--display);font-weight:400;font-size:1.5em;color:var(--berry)}
.lk{color:var(--muted);font-size:.85em}
.ans-count{font-variant-numeric:tabular-nums}
.bonus-box{background:var(--pine);border:2px solid var(--line);border-radius:1em;padding:1em 1.2em}
.bb-tag{display:inline-block;background:var(--gold);color:var(--ink);font-weight:800;border-radius:.4em;padding:.15em .6em;font-size:.85em;text-transform:uppercase;letter-spacing:.08em}
.bb-q{font-size:1.35em;font-weight:700;margin:.5em 0 .6em;line-height:1.25;overflow-wrap:anywhere}
.bb-opts{display:grid;grid-template-columns:1fr 1fr;gap:.5em}
.bb-opt{background:var(--pine-2);border-radius:.5em;padding:.45em .7em;font-weight:600;overflow-wrap:anywhere}
.bb-type{color:var(--muted);margin:0}

.rv-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:2em;align-items:center}
.rv-left{display:flex;gap:1.8em;align-items:center;min-width:0}
.rv-card{flex:0 0 auto;margin-left:.6em;width:17em;max-width:42%;background:var(--cream);color:var(--ink);border-radius:1em;padding:1.2em 1.1em 1.3em;text-align:center;
  transform:rotate(-2deg);box-shadow:0 .6em 1.6em rgba(0,0,0,.45);outline:.3em solid var(--gold);animation:drop .7s cubic-bezier(.2,1.4,.4,1) both}
.rv-year{font-family:var(--display);font-size:5em;line-height:1}
.rv-label{font-weight:700;font-size:1.25em;line-height:1.2;margin-top:.4em;overflow-wrap:anywhere}
.rv-facts{flex:1;min-width:0}
.rv-facts p{margin:0 0 .5em;font-size:1.2em;overflow-wrap:anywhere}
.rv-gap b{color:var(--good)} .rv-bonus b{color:var(--gold)}
.rv-n{font-weight:700}
.reveal-bonuses{margin-top:1em;padding:.7em 1em;border:2px solid var(--line);border-radius:1em;background:var(--pine)}
.reveal-bonuses h3{margin:0 0 .5em;font-family:var(--display);font-weight:400;font-size:1.15em;color:var(--ice)}
.bonus-replies{list-style:none;margin:0;padding:0 .25em 0 0;display:grid;gap:.4em .7em;
  grid-template-columns:repeat(auto-fit,minmax(min(100%,16em),1fr));max-height:12em;overflow:auto}
.bonus-replies li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.08em .5em;padding:.35em .65em;
  min-width:0;background:var(--night);border-radius:.5em;line-height:1.2;overflow-wrap:anywhere}
.bonus-reply-team{font-size:.82em;color:var(--muted)}
.bonus-reply-text{grid-column:1/-1;font-weight:700}
.bonus-reply-mark{line-height:1;font-weight:800}
.bonus-reply-mark.correct{color:var(--good)}
.bonus-reply-mark.wrong{color:var(--bad)}
.bonus-reply-text.missing{color:var(--muted);font-weight:400}
.hist{display:flex;gap:.4em;align-items:flex-end;height:7em;margin:.6em 0 .9em}
.hbar{display:flex;flex-direction:column;align-items:center;height:100%;flex:0 1 2.2em;min-width:0}
.hv{font-size:.85em;font-weight:700;font-variant-numeric:tabular-nums}
.hbw{flex:1;width:100%;display:flex;align-items:flex-end}
.hb{display:block;width:100%;min-height:3px;background:var(--line);border-radius:.3em .3em 0 0}
.hl{font-family:var(--display);font-size:.85em;width:1.9em;height:1.9em;max-width:100%;border-radius:50%;display:grid;place-items:center;margin-top:.3em;background:var(--pine-2)}
.hbar.ok .hb{background:var(--good)} .hbar.ok .hl{background:var(--good);color:var(--ink)}
.standings{background:var(--pine);border:2px solid var(--line);border-radius:1em;padding:1em 1.2em;min-width:0}
.standings h3{margin:0 0 .5em;font-family:var(--display);font-weight:400;font-size:1.3em;color:var(--gold)}
.st-row{animation:rise .4s ease both}
.st-delta{font-weight:800;color:var(--ink);background:var(--gold);border-radius:.4em;padding:0 .4em;font-size:.85em;font-variant-numeric:tabular-nums}
.st-delta.zero{background:transparent;color:var(--muted)}
.st-more{color:var(--muted);margin:.5em 0 0;font-size:.9em}
/* title cards */
.title-card{text-align:center;display:flex;flex-direction:column;align-items:center;gap:.5em;padding:.5em 1em}
.tc-kicker{text-transform:uppercase;letter-spacing:.2em;font-weight:800;font-size:1.2em;color:var(--ice)}
.tc-game .tc-kicker{color:var(--gold)}
.tc-big{font-family:var(--display);line-height:.95;color:var(--cream);overflow-wrap:anywhere;max-width:100%;
  font-size:min(9em,calc(var(--stage-w,100vw) * 1.25 / var(--len,8)));animation:stamp .7s cubic-bezier(.2,1.5,.4,1) both}
.tc-warm .tc-big{text-shadow:.06em .06em 0 #2f6f86}
.tc-game .tc-big{color:var(--gold);text-shadow:.06em .06em 0 var(--berry)}
.tc-sub{font-size:1.5em;margin:.2em 0 0;max-width:40em;text-wrap:balance}
.tc-steps{list-style:none;margin:.9em 0 0;padding:0;display:flex;gap:1em;flex-wrap:wrap;justify-content:center}
.tc-steps li{display:flex;align-items:center;gap:.6em;background:var(--pine);border:2px solid var(--line);border-radius:.8em;padding:.6em 1em;font-size:1.15em;font-weight:600;max-width:17em;text-align:left}
.tc-num{flex:0 0 auto;width:1.9em;height:1.9em;border-radius:50%;background:var(--ice);color:var(--ink);display:grid;place-items:center;font-family:var(--display)}
.st-mid.warm{background:var(--ice);color:var(--ink);border-radius:999px;padding:.25em .9em}
.badge.warm{background:#2f6f86}
.p-title{font-family:var(--display);font-size:52px;line-height:1;overflow-wrap:anywhere;max-width:100%}
.p-title.warm{color:var(--cream);text-shadow:3px 3px 0 #2f6f86}
.p-title.game{color:var(--gold);text-shadow:3px 3px 0 var(--berry)}
.p-main.center .p-title + .p-lead{margin-top:6px}
@keyframes stamp{from{transform:scale(1.6) rotate(-4deg);opacity:0}}
.warm-note{font-size:1.25em;margin:0;line-height:1.35}
.warm-done{text-align:center;font-weight:700}

.final{display:flex;flex-direction:column;align-items:center;gap:1em}
.host.stage.ph-final{background:radial-gradient(ellipse at 50% 25%,rgba(243,185,77,.13),transparent 58%),
  radial-gradient(ellipse at 50% 0%,#1c4136,transparent 76%),var(--night)}
.final-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,14em),1fr));gap:.85em;width:100%;max-width:64em}
.final-group{min-width:0;background:rgba(22,53,45,.94);border:2px solid var(--line);border-radius:1em;
  padding:.75em .9em;animation:rise .55s ease both}
.final-group h3{font:400 1.18em/1.2 var(--display);color:var(--ice);margin:0 0 .4em;overflow-wrap:anywhere}
.final-group .st-list{max-height:11em;overflow:auto}
.final-group .st-row{animation:none}
.final-group .st-row:last-child{border-bottom:0}
.final-group .st-score{flex:0 0 auto;white-space:nowrap}
.final-group.first{border-color:var(--gold);box-shadow:0 0 1.5em rgba(243,185,77,.24);animation:rise .7s .65s both}
.final-group.first h3,.final-group.first .st-score{color:var(--gold)}

  font:400 clamp(1.25em,3.9vw,2.3em)/1.2 var(--display);text-shadow:.055em .055em 0 #67442a;animation:rise .6s 1.1s both}

/* ---------- big screen: setup ---------- */
.host.setup{font-size:16px;max-width:1180px;margin:0 auto;padding:24px 20px 60px;display:flex;flex-direction:column;gap:16px}

.su-head h1{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.1;margin:0;color:var(--gold)}
.su-sub{margin:6px 0 0;color:var(--muted);max-width:62ch}
.loading{color:var(--muted);text-align:center;margin-top:30vh}
.su-ver{margin:4px 0 0;color:var(--muted);font-size:13px}
.p-ver{margin:24px 0 0;color:#6f8a81;font-size:12px;text-align:center}
.pill{display:inline-block;border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;background:var(--pine-2)}
.pill.ok{background:#1d4f3a;color:var(--good)} .pill.warn{background:#4a3a12;color:var(--gold)} .pill.bad{background:#4a1d22;color:var(--bad)}
.su-grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px;align-items:start}
.su-panel{background:var(--pine);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.su-panel h2{font-family:var(--display);font-weight:400;font-size:20px;margin:4px 0 0}
.count{font-family:var(--body);font-weight:800;font-size:14px;background:var(--pine-2);border-radius:999px;padding:2px 10px;vertical-align:middle}
.hint{color:var(--muted);margin:0;font-size:14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld-l{font-size:13px;font-weight:700;color:var(--muted)}
.fld small{color:var(--muted);font-size:12.5px}
.host input[type=text],.host input[type=number],.host select,.host textarea,.phone input[type=text]{background:#0f2420;border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--cream);width:100%;min-width:0}
.host input::placeholder,.phone input::placeholder{color:#6f8a81}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row-ty{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:10px}
.errs{margin:0;padding:10px 12px 10px 28px;background:#4a1d22;border-radius:8px;color:#ffd9d9;font-size:14px}
.su-actions{display:flex}
.su-tools{display:flex;flex-wrap:wrap;gap:8px}
.q-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.q-item{background:#12302a;border:1px solid var(--line);border-radius:10px}
.q-item summary{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;list-style:none;border-radius:10px}
.q-item summary::-webkit-details-marker{display:none}
.q-num{flex:0 0 26px;height:26px;border-radius:50%;background:var(--pine-2);display:grid;place-items:center;font-weight:800;font-size:13px}
.q-kind{color:var(--gold);flex:0 0 1em;text-align:center}
.q-title{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.q-year{font-family:var(--display);color:var(--gold);flex:0 0 auto}
.q-body{padding:12px 12px 14px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;align-self:flex-start;flex-wrap:wrap}
.seg-b{border:0;background:transparent;padding:8px 14px;cursor:pointer;font-weight:600}
.seg-b.on{background:var(--gold);color:var(--ink)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:flex;align-items:center;gap:8px;min-width:0}
.opt input[type=radio]{width:18px;height:18px;accent-color:var(--gold);flex:0 0 auto}
.q-tools{display:flex;gap:8px;flex-wrap:wrap}
.overlay{position:fixed;inset:0;background:rgba(5,12,10,.72);display:grid;place-items:center;padding:16px;z-index:50}
.dialog{background:var(--pine);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(720px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px;font-size:16px}
.dialog h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0}
.io-msg{margin:0;color:var(--muted);font-size:14px}
.io-text{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;min-height:220px}
.io-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.io-btns{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- phone page ---------- */
.phone{font-size:16px;display:flex;flex-direction:column;min-height:100%;max-width:520px;margin:0 auto;position:relative;background:var(--night)}
.phone > *{position:relative;z-index:1}
.p-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;background:var(--pine);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.p-team{font-weight:800;min-width:0;overflow-wrap:anywhere}
.p-score{font-family:var(--display);color:var(--gold);white-space:nowrap}
.p-banner{background:#4a1d22;color:#ffd9d9;padding:8px 16px;font-size:14px;text-align:center}
.p-main{flex:1;padding:16px;display:flex;flex-direction:column;gap:16px}
.p-main.center{align-items:center;justify-content:center;text-align:center}
.p-main.join{justify-content:center;padding:24px 20px}
.p-h1{font-family:var(--display);font-weight:400;font-size:36px;line-height:1.05;margin:0;color:var(--gold)}
.p-lead{margin:0;font-size:17px}
.p-big{font-family:var(--display);font-size:30px;margin:0;line-height:1.1}
.p-note{color:var(--muted);font-size:14px;margin:0}
.p-form{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.p-fld{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px;color:var(--muted)}
.phone .p-fld input,.phone .p-input{font-size:20px;padding:13px 14px;border-radius:12px}
.phone #p-code{text-transform:uppercase;letter-spacing:.2em;font-family:var(--display)}
.p-err{color:#ffd9d9;background:#4a1d22;border-radius:10px;padding:10px 12px;margin:0;font-size:15px}
.btn-send{border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:800;background:var(--pine-2);color:var(--muted);width:100%;cursor:pointer;min-height:56px}
.btn-send.ready{background:var(--gold);color:var(--ink)}
.btn-send:disabled{cursor:default}
.p-link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:12px;font-size:14px;align-self:center}
.p-check{width:84px;height:84px;border-radius:50%;background:var(--good);color:var(--ink);font-size:44px;display:grid;place-items:center;font-weight:800}
.p-lock{width:64px;height:64px;border-radius:50%;border:6px solid var(--berry);position:relative}
.p-lock::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:24px;margin:-22px 0 0 -3px;background:var(--berry);border-radius:3px}
.p-timer{display:flex;align-items:center;gap:10px}
.p-tbar{flex:1;height:10px;border-radius:999px;background:var(--pine-2);overflow:hidden;display:block}
.p-tfill{display:block;height:100%;width:100%;background:var(--gold);border-radius:999px;transition:width .25s linear}
.p-timer.low .p-tfill{background:var(--berry)}
.p-tnum{font-family:var(--display);font-variant-numeric:tabular-nums;min-width:3.2em;text-align:right}
.p-q{background:var(--cream);color:var(--ink);border-radius:14px;padding:14px 16px}
.p-q .badge{font-size:11px}
.p-qtext{font-family:var(--display);font-size:22px;line-height:1.15;margin:8px 0 0;overflow-wrap:anywhere}
.p-sec h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--ice);margin:0 0 10px}
.p-bq{font-weight:700;font-size:17px;margin:0 0 10px;overflow-wrap:anywhere}
.vt{display:flex;flex-direction:column;gap:6px;padding-left:14px;border-left:3px solid var(--line);margin-left:8px}
.vslot{display:flex;align-items:center;gap:12px;background:transparent;border:2px dashed var(--line);border-radius:12px;padding:8px 12px;min-height:52px;cursor:pointer;text-align:left;width:100%}
.vslot.on{background:var(--gold);border:2px solid var(--gold);color:var(--ink)}
.vs-l{font-family:var(--display);width:32px;height:32px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;flex:0 0 auto}
.vslot.on .vs-l{background:var(--ink);color:var(--gold)}
.vs-t{font-weight:700;font-size:16px}
.vcard{background:var(--cream);color:var(--ink);border-radius:10px;padding:8px 12px;display:flex;gap:10px;align-items:baseline}
.vcard b{font-family:var(--display);font-weight:400;font-size:18px;flex:0 0 auto}
.vcard span{font-size:14px;font-weight:600;line-height:1.2;overflow-wrap:anywhere;min-width:0}
.p-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.p-opt{border:2px solid var(--line);background:var(--pine);border-radius:12px;padding:12px;min-height:52px;font-weight:700;cursor:pointer;overflow-wrap:anywhere}
.p-opt.on{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.p-foot{position:sticky;bottom:0;background:var(--night);border-top:1px solid var(--line);padding:8px 16px 14px;display:flex;flex-direction:column;gap:6px;z-index:5}
.send-status{margin:0;font-size:14px;min-height:20px;text-align:center;color:var(--muted)}
.send-status.ok{color:var(--good);font-weight:700}
.send-status.bad{color:#ffb3b3}
.p-mine{display:flex;flex-direction:column;gap:4px;background:var(--pine);border-radius:12px;padding:12px 16px}
.p-reveal{background:var(--cream);color:var(--ink);border-radius:16px;padding:16px;text-align:center;outline:4px solid var(--gold);outline-offset:-4px}
.pr-year{font-family:var(--display);font-size:54px;line-height:1}
.pr-label{font-weight:700;margin-top:6px;overflow-wrap:anywhere}
.p-rows{display:flex;flex-direction:column;gap:8px}
.p-row{background:var(--pine);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.pr-k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.pr-v{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.pr-v b{overflow-wrap:anywhere;min-width:0}
.pr-v small{flex-basis:100%;color:var(--muted);font-size:14px}
.mk{font-weight:800;border-radius:6px;padding:1px 8px;font-size:14px}
.mk.ok{background:var(--good);color:var(--ink)} .mk.bad{background:var(--bad);color:var(--ink)} .mk.none{background:var(--pine-2);color:var(--muted)}
.p-total{text-align:center;display:flex;flex-direction:column;gap:4px}
.pt-delta{font-family:var(--display);font-size:32px;color:var(--gold)}
.pt-delta.zero{color:var(--muted)}
.pt-rank{font-weight:700}
.p-place{font-family:var(--display);font-size:84px;line-height:1}
.p-place.win{color:var(--gold)}
.p-topbox{width:100%;background:var(--pine);border-radius:12px;padding:12px 16px;text-align:left}
.p-topbox h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--ice);margin:0 0 6px}
.p-toplist li.me .st-name{color:var(--gold)}

/* ---------- motion ---------- */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 .22em rgba(243,185,77,.2),0 0 1.2em rgba(243,185,77,.5)}50%{box-shadow:0 0 0 .32em rgba(243,185,77,.3),0 0 2em rgba(243,185,77,.85)}}
@keyframes drop{from{transform:translateY(-1.2em) scale(1.12) rotate(-6deg);opacity:0}}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@keyframes rise{from{transform:translateY(.6em);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}

/* ---------- narrow screens ---------- */
@media (max-width:760px){
  .host.stage{font-size:13px;padding:.9em 1em}
  .st-head{flex-wrap:wrap}
  .st-title{flex-basis:100%}
  .st-join{justify-content:space-between}
  .lobby,.q-grid,.rv-grid{grid-template-columns:minmax(0,1fr)}
  .join-card{flex-direction:column;text-align:center}
  .qr{max-width:70%;width:15em}
  .rv-left{flex-direction:column;align-items:stretch}
  .rv-card{max-width:none;width:auto}
  .q-text{font-size:2.2em} .q-text.lg{font-size:1.8em} .q-text.xl{font-size:1.4em}
  .su-grid{grid-template-columns:minmax(0,1fr)}
  .opts{grid-template-columns:minmax(0,1fr)}
}

<script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      dock.appendChild(frame);
      var bScreen = h('button', { type: 'button', class: 'on', text: 'Big screen', onclick: function () { pick('screen'); } });
      var bPhone = h('button', { type: 'button', text: 'Test phone', onclick: function () { pick('phone'); } });
      var pick = function (t) { document.body.setAttribute('data-tab', t); bScreen.classList.toggle('on', t === 'screen'); bPhone.classList.toggle('on', t === 'phone'); };
      tabs.appendChild(bScreen); tabs.appendChild(bPhone);
      mounted.push(TLmountHost(stage, backend, {}));
      mounted.push(TLmountPlayer(frame, backend, { storeKey: null, code: 'DEMO' }));
      return;
    }
    dock.hidden = true;
    if (hash.toLowerCase() === 'host') { mounted.push(TLmountHost(stage, backend, {})); return; }
    var code = /^[A-Za-z0-9]{3,6}$/.test(hash) ? hash.toUpperCase() : '';
    mounted.push(TLmountPlayer(stage, backend, { code: code }));
  }

  function start(cfg) {
    backend = cfg ? new TLFirestoreBackend(cfg) : new TLLocalBackend();
    TLclear(stage);
    window.addEventListener('hashchange', route);
    route();
  }
  if (inline) start(inline);
  else if (/^https?:$/.test(location.protocol)) {
    stage.appendChild(h('p', { class: 'loading', text: 'Loading\u2026' }));
    fetch('firebase-config.txt', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.text() : ''; })
      .then(function (t) { start(TLparseConfig(t)); }, function () { start(null); });
  } else start(null);
})();

</script>
</body>
</html>
